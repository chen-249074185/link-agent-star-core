# 求职者画像筛选规则（liepin_filter_jobs 用）
# 改这里即可调整筛选行为，无需改代码（筛选规则配置化）
profile:
  # 学历要求：岗位要求的学历 = 本科 或 学历不限 都算匹配
  education: "本科"
  # 可接受的经验要求关键词：岗位经验要求命中任一即算匹配
  # （经验不限 / 应届 / 实习 / 1年以下 —— 应届生能投的岗位形态）
  workYearKeywords: ["经验不限", "应届", "实习", "以下"]
  # 薪资下限（k/月）：岗位薪资下限 ≥ 此值才匹配（薪资为"面议"时放行）
  salaryFloorK: 10
  # 期望城市：岗位地点命中任一城市即算匹配
  cities: ["北京", "上海", "杭州", "南京"]