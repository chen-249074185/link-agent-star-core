# 场景策略表：5 个场景各配 模型/工具白名单/记忆策略/回复风格
# 注意：policies 层不能省！@ConfigurationProperties 绑定 JavaBean 时，
#       Map 字段名(policies) 是配置键的下一层（坑27：少了这层绑定静默失败）
linkagent.scene-policy:
  policies:
    CHAT:            # 场景名必须与 Scene 枚举一字不差
      model: deepseek-v4-flash   # 闲聊→DeepSeek 新 ID（deepseek-chat 别名 2026-07 退役）
      tools:             # 瑞幸点单工具：非空=SSE 才进工具循环（空白名单会退回纯聊天流，模型拿不到工具）
        - mcp_queryShopList
        - mcp_searchProductForMcp
        - mcp_switchProduct
        - mcp_queryProductDetailInfo
        - mcp_previewOrder
        - mcp_createOrder
        - mcp_queryOrderDetailInfo
        - mcp_cancelOrder
      memory: ephemeral      # 记忆策略：ephemeral=瞬时 / none=不记（W6 才实现，先占位）
      reply-style: casual    # 回复风格（W5 后期生成回复用，先占位）
    CREATION:
      model: qwen-max        # 创作→阿里云最强模型
      tools: []
      memory: ephemeral
      reply-style: creative
    OFFICE:
      model: deepseek-v4-flash
      tools:                 # 列表写法，技能名要和 SkillRegistry 清单一致
        - commute_estimate
        - house_score
        - rent_risk
      memory: ephemeral
      reply-style: professional
    DATA:
      model: deepseek-v4-flash
      tools:
        - get_weather
      memory: ephemeral
      reply-style: concise
    GROUP:
      model: deepseek-v4-flash
      tools: []
      memory: none           # 群聊安全：不记记忆、不调工具
      reply-style: polite

# W14 11-11 接口文档：SpringDoc OpenAPI 分组（浏览器打开 /swagger-ui.html 选择分组调试）
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  group-configs:
    - group: chat          # 对话/历史
      paths-to-match: /api/chat/**
    - group: admin         # 管理端（X-Admin-Token 凭证）
      paths-to-match: /api/admin/**
    - group: rag           # 私有知识库
      paths-to-match: /api/rag/**
    - group: user          # 登录注册/配置/人设/文件/采集
      paths-to-match: /api/user/**, /api/config/**, /api/personas/**, /api/file/**, /api/collect/**, /api/reindex/**