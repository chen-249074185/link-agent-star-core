<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星链智核 · 对话</title>
<style>
:root{
  --bg-app:#f3f1ec;--bg-app-grad:linear-gradient(180deg,#f3f1ec 0%,#efeae2 100%);
  --bg-side:#fffdf9;--bg-hover:rgba(74,43,43,.05);
  --bg-active:linear-gradient(90deg,rgba(224,120,120,.12) 0%,rgba(224,120,120,.05) 100%);
  --bg-input:#ffffff;--line:rgba(74,43,43,.09);
  --txt:#4a2b2b;--txt-2:#8a7070;--txt-3:#c4b3b3;
  --accent:#e07878;--accent-grad:linear-gradient(135deg,#e07878,#d94f4f);
  --bubble-grad:linear-gradient(135deg,#4a2b2b,#6b3f3f);--bubble-text:#fffdf9;
  --side-top-bg:linear-gradient(180deg,#faf6f0 0%,#f5eee6 100%);
  --kbd-bg:#f5f0ea;--kbd-line:#e6ddd3;--msg-text:#5d4646;
  --scroll:#dccfc2;--scroll-h:#cdbdb0;--shadow:0 12px 32px rgba(74,43,43,.14);
  --red:#d94f4f;--green:#5aa87a;--pink:#d94f4f;
}
[data-theme="dark"]{
  --bg-app:#0b0d14;--bg-app-grad:linear-gradient(180deg,#0b0d14 0%,#0f1220 100%);
  --bg-side:#0c0f18;--bg-hover:rgba(255,255,255,.06);
  --bg-active:linear-gradient(90deg,rgba(110,231,255,.10) 0%,rgba(110,231,255,.04) 100%);
  --bg-input:#141720;--line:#1e2334;
  --txt:#e6e6e8;--txt-2:#9aa0b4;--txt-3:#5f6478;
  --accent:#6ee7ff;--accent-grad:linear-gradient(135deg,#6ee7ff,#a78bfa);
  --bubble-grad:linear-gradient(135deg,#6ee7ff,#a78bfa);--bubble-text:#0b0d14;
  --side-top-bg:linear-gradient(180deg,#0c0f18 0%,#131a2e 100%);
  --kbd-bg:#1c2030;--kbd-line:#2a2f42;--msg-text:#d0d4e0;
  --scroll:#2a2f42;--scroll-h:#3a4055;--shadow:0 12px 32px rgba(0,0,0,.55);
  --red:#f04438;--green:#34d399;--pink:#ff5c8a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg-app-grad);color:var(--txt);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:var(--scroll-h)}
::-webkit-scrollbar-track{background:transparent}
.app{display:flex;height:100vh;overflow:hidden}

/* ===== 左侧栏 ===== */
.side{width:var(--side-w,270px);flex:none;background:var(--bg-side);border-right:1px solid var(--line);
  display:flex;flex-direction:column;transition:width .22s ease,opacity .22s ease;overflow:hidden}
.app.collapsed .side{width:0;opacity:0;border-right:none}
.side-top{position:relative;display:flex;align-items:center;padding:12px 6px;background:var(--side-top-bg);border-bottom:1px solid var(--line)}
.logo{white-space:nowrap;display:flex;align-items:center}
.logo svg{width:230px;height:86px;display:block}
[data-theme="dark"] .logo-light{display:none}
[data-theme="light"] .logo-dark{display:none}
.spin{transform-box:fill-box;transform-origin:center;animation:spin linear infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse ease-in-out infinite}
.flow{stroke-dasharray:6 10;animation:flow linear infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.18);opacity:.75}}
@keyframes flow{to{stroke-dashoffset:-160}}
.srch-float{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;z-index:2}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;
  color:var(--txt-2);cursor:pointer;background:transparent;border:none;transition:.15s;flex:none}
.icon-btn:hover{background:var(--bg-hover);color:var(--txt)}
.nav{padding:4px 10px 8px;display:flex;flex-direction:column;gap:2px;white-space:nowrap}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--txt);cursor:pointer;transition:.15s}
.nav-item:hover{background:var(--bg-hover)}
.nav-item:hover .ic{color:var(--accent)}
.nav-item .txt{flex:1;overflow:hidden;text-overflow:ellipsis}
.nav-item .tail{color:var(--txt-3);display:inline-flex}
.side-scroll{flex:1;overflow-y:auto;padding:0 10px 10px}
.sec-title{font-size:12px;color:var(--txt-3);padding:14px 10px 6px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.sec-title::before{content:'';width:3px;height:12px;border-radius:2px;background:var(--accent-grad)}
.recent{display:flex;flex-direction:column;gap:1px}
.recent-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--txt-2);cursor:pointer;transition:.15s;white-space:nowrap;position:relative}
.recent-item:hover{background:var(--bg-hover);color:var(--txt)}
.recent-item.active{background:var(--bg-active);color:var(--txt);font-weight:600}
.recent-item .name{flex:1;overflow:hidden;text-overflow:ellipsis}
.recent-item .t{font-size:11px;color:var(--txt-3);flex:none}
.recent-item .rm{display:none;background:none;border:none;color:var(--txt-3);cursor:pointer;font-size:13px;padding:0 4px}
.recent-item:hover .rm{display:inline-flex}
.recent-item .rm:hover{color:var(--red)}
.recent-empty{text-align:center;color:var(--txt-3);font-size:12.5px;padding:18px 8px;line-height:1.8}
.spinner{width:14px;height:14px;border:2px solid var(--txt-3);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.side-foot{border-top:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:10px;white-space:nowrap}
.avatar{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:600;color:#fff;cursor:pointer;overflow:hidden}
.avatar svg{width:100%;height:100%;display:block}
[data-theme="light"] .av-demon{display:none!important}
[data-theme="dark"] .av-angel{display:none!important}
.side-foot .name{flex:1;overflow:hidden;text-overflow:ellipsis}
.mini-panel{display:none;position:absolute;left:44px;top:52px;z-index:41;width:210px;background:var(--bg-side);
  border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:8px;flex-direction:column;gap:2px}
.mini-panel.show{display:flex}
.mini-panel .nav-item{font-size:13px}

/* ===== 右侧主区 ===== */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:56px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--line);
  position:relative;background:var(--bg-side)}
.topbar .center{position:absolute;left:50%;transform:translateX(-50%);text-align:center;max-width:60%}
.topbar .title{font-size:14px;font-weight:600}
.topbar .sub{font-size:11px;color:var(--txt-3)}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.theme-btn .moon{display:none}
[data-theme="dark"] .theme-btn .moon{display:inline-flex}
[data-theme="dark"] .theme-btn .sun{display:none}
.messages{flex:1;overflow-y:auto;position:relative}
.messages-inner{max-width:1000px;margin:0 auto;padding:28px 32px 40px}
.msg{margin-bottom:22px}
.msg p{margin:8px 0;color:var(--msg-text)}
.msg b,.msg strong{color:var(--txt)}
.msg ul,.msg ol{margin:8px 0 8px 22px;color:var(--msg-text)}
.msg li{margin:4px 0}
.msg hr{border:none;border-top:1px solid var(--line);margin:22px 0}
.msg.user{display:flex;justify-content:flex-end}
.bubble{background:var(--bubble-grad);border-radius:16px;padding:12px 16px;max-width:70%;color:var(--bubble-text);box-shadow:0 2px 8px rgba(56,198,238,.18);white-space:pre-wrap;word-break:break-word}
.bubble.typing{background:var(--bg-hover);color:var(--txt-3);box-shadow:none}
.typing i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--txt-3);margin:0 2px;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.to-bottom{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:38px;height:38px;border-radius:50%;
  background:var(--bg-side);border:1px solid var(--line);color:var(--txt);display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:.15s;box-shadow:0 2px 8px rgba(31,35,41,.08)}
.to-bottom:hover{background:var(--bg-hover);color:var(--accent)}

/* ===== 输入区 ===== */
.composer{flex:none;padding:10px 24px 18px}
.composer-box{max-width:1000px;margin:0 auto;background:var(--bg-input);border:1px solid var(--line);border-radius:16px;
  padding:12px 14px 8px;transition:.15s}
.composer-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,198,238,.15)}
.composer-box textarea{width:100%;background:transparent;border:none;outline:none;resize:none;color:var(--txt);
  font:inherit;line-height:1.6;max-height:200px}
.composer-box textarea::placeholder{color:var(--txt-3)}
.tools{display:flex;align-items:center;gap:4px;margin-top:6px;flex-wrap:wrap}
.tool{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;color:var(--txt-2);
  font-size:13px;cursor:pointer;transition:.15s;background:transparent;border:none}
.tool:hover{background:var(--bg-hover);color:var(--accent)}
.tool .ic{width:16px;height:16px}
.sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.tools .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.mode{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-size:13px;cursor:pointer;font-weight:600}
.send{width:34px;height:34px;border-radius:50%;background:var(--accent-grad);border:none;color:#fff;display:flex;
  align-items:center;justify-content:center;cursor:pointer;transition:.15s;box-shadow:0 2px 6px rgba(56,198,238,.3)}
.send:hover{filter:brightness(1.08)}
.send.stop{background:var(--red);box-shadow:0 2px 6px rgba(240,68,56,.3)}
.send.stop:hover{background:var(--red);filter:none}
.send:disabled{opacity:.4;cursor:not-allowed;background:var(--txt-3);box-shadow:none}
.send .ic-stop{display:none}
.send.stop .ic-send{display:none}
.send.stop .ic-stop{display:inline-flex}

/* 上传面板 */
.attach-panel{max-width:1000px;margin:0 auto 10px;background:var(--bg-input);border:1px solid var(--line);border-radius:16px;
  padding:16px;box-shadow:var(--shadow)}
.ap-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ap-head h4{font-size:14px}
.ap-drop{border:2px dashed var(--line);border-radius:12px;padding:24px 16px;text-align:center;color:var(--txt-3);font-size:13px;cursor:pointer;transition:.2s}
.ap-drop:hover{border-color:var(--accent);color:var(--accent)}
.ap-drop.drag{background:var(--bg-active);border-color:var(--accent);color:var(--accent)}
.ap-drop .ic{width:26px;height:26px;margin:0 auto 8px;display:block}
.ap-list{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.ap-file{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg-hover);border-radius:8px;font-size:12.5px}
.ap-file .fn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ap-file .fs{color:var(--txt-3);flex:none}
.ap-file .rm{background:none;border:none;color:var(--txt-3);cursor:pointer;font-size:14px;padding:0 4px}
.ap-file .rm:hover{color:var(--red)}
.ap-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.ap-tip{font-size:11.5px;color:var(--txt-3)}
.ap-send{padding:9px 18px;border-radius:10px;border:none;background:var(--accent-grad);color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.ap-send:hover{filter:brightness(1.06)}
.ap-send:disabled{opacity:.4;cursor:not-allowed}

/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:90;padding:20px}
.mask.show{display:flex}
.search-modal{width:560px;max-width:100%;background:var(--bg-side);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.sm-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sm-head .sm-title{display:flex;align-items:center;gap:8px}
.sm-head .sm-title .sm-ic{width:30px;height:30px;border-radius:8px;background:var(--accent-grad);color:#fff;display:flex;align-items:center;justify-content:center}
.sm-head h3{font-size:16px}
.search-modal input{width:100%;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--bg-input);
  padding:0 14px;font-size:14px;color:var(--txt);outline:none}
.search-modal input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(56,198,238,.15)}
.s-results{margin-top:12px;max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.s-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;font-size:13.5px;color:var(--txt-2);cursor:pointer;transition:.15s}
.s-item:hover{background:var(--bg-hover);color:var(--txt)}
.s-item .s-dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none;box-shadow:0 0 0 3px rgba(52,211,153,.15)}
.s-item .s-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-item .s-time{font-size:12px;color:var(--txt-3);flex:none}
.s-empty{text-align:center;color:var(--txt-3);font-size:13px;padding:24px 0}
.avatar-modal{width:360px;max-width:100%;background:var(--bg-side);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);text-align:center}
.am-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;text-align:left}
.am-head h3{font-size:15px}
.am-prev{width:72px;height:72px;border-radius:50%;margin:0 auto 16px;background:var(--bg-hover);background-size:cover;background-position:center;border:2px solid var(--line)}
.am-prev.hint::after{content:'默认头像';font-size:11px;color:var(--txt-3);display:flex;align-items:center;justify-content:center;height:100%}
.am-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.am-btn{padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:.15s}
.am-btn.pick{background:var(--bg-hover);color:var(--txt)}
.am-btn.ok{background:var(--accent-grad);color:#fff}
.am-btn.danger{background:transparent;border:1px solid var(--line);color:var(--txt-3)}
.am-btn.danger:hover{color:var(--red);border-color:var(--red)}
@media (max-width:860px){
  .side{position:fixed;z-index:30;height:100%;box-shadow:0 0 40px rgba(0,0,0,.5)}
  .app.collapsed .side{box-shadow:none}
  .topbar .center{max-width:50%}
}
</style>
</head>

  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="8" y="8" width="8" height="8" rx="1.5"/></symbol>
</svg>

<div class="app" id="app">
  <!-- ===== 左侧栏 ===== -->
  <aside class="side">
    <div class="side-top">
      <span class="logo">
        <svg class="logo-light" viewBox="0 0 320 120" aria-hidden="true">
          <defs>
            <linearGradient id="lgl" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#e07878"/><stop offset="100%" stop-color="#d94f4f"/>
            </linearGradient>
            <radialGradient id="lgc" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#fff"/><stop offset="55%" stop-color="#e07878"/><stop offset="100%" stop-color="#e07878" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <g transform="translate(0,0)">

<!-- 头像上传弹窗 -->
<div class="mask" id="avatarMask">
  <div class="avatar-modal">
    <div class="am-head">
      <h3>更换头像</h3>
      <button class="icon-btn" onclick="closeAvatar()" style="font-size:16px">✕</button>
    </div>
    <div class="am-prev" id="amPrev"></div>
    <input type="file" id="avFile" accept="image/*" style="display:none">
    <div class="am-actions">
      <button class="am-btn pick" onclick="document.getElementById('avFile').click()">选择图片</button>
      <button class="am-btn ok" id="avSave" onclick="saveAvatar()" disabled>保存</button>
      <button class="am-btn danger" onclick="resetAvatar()">恢复默认</button>
    </div>
  </div>

<script>
const $ = id => document.getElementById(id);
const app = $('app'), messages = $('messages'), thread = $('thread'), input = $('input'), sendBtn = $('send');
const token = sessionStorage.getItem('token');
const userId = sessionStorage.getItem('userId');
let streaming = false, currentSessionId = null;

if (!token) { location.replace('login.html'); }

// 防回退：退出登录后浏览器"返回"可能从 bfcache 恢复本页——再查一次 token，没有就踢回登录页（replace 不产生历史记录）
window.addEventListener('pageshow', e => {
  if (!sessionStorage.getItem('token')) location.replace('login.html');
});

/* ===== 登录态 ===== */
fetch('/api/user/me', { headers: { 'Authorization': 'Bearer ' + token } })
  .then(r => r.json())
  .then(j => { if (j.code !== 0) { location.href = 'login.html'; return; } $('footName').textContent = j.data.username || '用户'; })
  .catch(() => {});

/* ===== 主题 ===== */
const root = document.documentElement;
const savedTheme = localStorage.getItem('theme');
if (savedTheme === 'light' || savedTheme === 'dark') root.dataset.theme = savedTheme;
$('themeBtn').onclick = () => {
  const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
  root.dataset.theme = next;
  localStorage.setItem('theme', next);
};

/* ===== 头像 ===== */
const userAvatar = $('userAvatar');
let avatarData = localStorage.getItem('avatar') || null, pendingAvatar = null;
function applyAvatar(){
  if (avatarData) { userAvatar.style.backgroundImage = 'url(' + avatarData + ')'; userAvatar.style.backgroundSize = 'cover'; userAvatar.querySelectorAll('svg').forEach(s => s.style.display = 'none'); }
  else { userAvatar.style.backgroundImage = ''; userAvatar.querySelectorAll('svg').forEach(s => s.style.display = ''); }
}
applyAvatar();
const avSave = $('avSave'), amPrev = $('amPrev');
function openAvatar(){ $('avatarMask').classList.add('show'); pendingAvatar = null; avSave.disabled = true;
  if (avatarData) { amPrev.classList.remove('hint'); amPrev.style.backgroundImage = 'url(' + avatarData + ')'; }
  else { amPrev.classList.add('hint'); amPrev.style.backgroundImage = ''; } }
function closeAvatar(){ $('avatarMask').classList.remove('show'); }
$('avFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  if (!f.type.startsWith('image/')) return;
  const rd = new FileReader();
  rd.onload = () => { pendingAvatar = rd.result; amPrev.classList.remove('hint'); amPrev.style.backgroundImage = 'url(' + pendingAvatar + ')'; avSave.disabled = false; };
  rd.readAsDataURL(f);
});
function saveAvatar(){ if (!pendingAvatar) return; avatarData = pendingAvatar; localStorage.setItem('avatar', avatarData); applyAvatar(); closeAvatar(); }
function resetAvatar(){ avatarData = null; localStorage.removeItem('avatar'); applyAvatar(); closeAvatar(); }
$('avatarMask').addEventListener('click', e => { if (e.target === $('avatarMask')) closeAvatar(); });

/* ===== 侧栏折叠 + 悬停小窗 ===== */
$('toggleSide').onclick = () => app.classList.toggle('collapsed');
const toggleBtn = $('toggleSide'), mini = $('miniPanel');
let hideTimer;
const showMini = () => { clearTimeout(hideTimer); mini.classList.add('show'); };
const hideMini = () => { hideTimer = setTimeout(() => mini.classList.remove('show'), 200); };
toggleBtn.addEventListener('mouseenter', () => { if (app.classList.contains('collapsed')) showMini(); });
toggleBtn.addEventListener('mouseleave', hideMini);
mini.addEventListener('mouseenter', showMini);
mini.addEventListener('mouseleave', hideMini);

/* ===== 滚动到底 ===== */
const toBottom = $('toBottom');
const scrollBottom = () => messages.scrollTop = messages.scrollHeight;
toBottom.onclick = scrollBottom;
messages.addEventListener('scroll', () => {
  const atBottom = messages.scrollHeight - messages.scrollTop - messages.clientHeight < 60;
  toBottom.style.opacity = atBottom ? '0' : '1';
  toBottom.style.pointerEvents = atBottom ? 'none' : 'auto';
});

/* ===== 消息渲染 ===== */
function addMsg(role, text){
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  const b = document.createElement('div');
  b.className = 'bubble' + (text === '' ? ' typing' : '');
  if (text === '') { b.innerHTML = '<i></i><i></i><i></i>'; }
  else { b.textContent = text; }
  d.appendChild(b);
  thread.appendChild(d);
  scrollBottom();
  return b;
}
function fmtTime(iso){
  if (!iso) return '';
  const d = new Date(iso);
  const pad = n => String(n).padStart(2, '0');
  return (d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

/* ===== 历史列表 ===== */
async function loadHistory(){
  const box = $('recent');
  try {
    const r = await fetch('/api/chat/history?userId=' + encodeURIComponent(userId), { headers: { 'Authorization': 'Bearer ' + token } });
    const j = await r.json();
    if (j.code !== 0) { box.innerHTML = '<div class="recent-empty">历史加载失败</div>'; return; }
    if (!j.data.length) { box.innerHTML = '<div class="recent-empty">还没有历史对话<br>先聊几句试试</div>'; return; }
    box.innerHTML = j.data.map(s =>
      '<div class="recent-item" data-sid="' + escapeHtml(s.sessionId) + '">' +
        '<span class="name">' + escapeHtml(s.title) + '</span>' +
        '<span class="t">' + fmtTime(s.time) + '</span>' +
        '<button class="rm" title="删除会话" onclick="event.stopPropagation();delSession(this)">✕</button>' +
      '</div>').join('');
    box.querySelectorAll('.recent-item').forEach(el => el.onclick = () => openSession(el.dataset.sid, el));
  } catch (e) { box.innerHTML = '<div class="recent-empty">历史加载失败</div>'; }
}

function openSession(sessionId, el){
  currentSessionId = sessionId;
  document.querySelectorAll('.recent-item').forEach(x => x.classList.remove('active'));
  if (el) el.classList.add('active');
  thread.innerHTML = '';
  $('curTitle').textContent = '加载中…';
  fetch('/api/chat/history/' + encodeURIComponent(sessionId) + '?userId=' + encodeURIComponent(userId), { headers: { 'Authorization': 'Bearer ' + token } })
    .then(r => r.json())
    .then(j => {
      if (j.code !== 0) return;
      $('curTitle').textContent = '历史对话';
      j.data.forEach(m => {
        if (m.role === 'user') addMsg('user', m.content);
        else if (m.role === 'assistant') addMsg('assistant', m.content);
      });
    });
}

async function delSession(btn){
  const el = btn.closest('.recent-item');
  if (!el) return;
  if (!confirm('删除该会话？不可恢复。')) return;
  const sid = el.dataset.sid;
  const r = await fetch('/api/chat/history/' + encodeURIComponent(sid) + '?userId=' + encodeURIComponent(userId),
    { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } });
  const j = await r.json();
  if (j.code === 0) {
    if (currentSessionId === sid) newChat();
    loadHistory();
  }
}

function newChat(){
  currentSessionId = null;
  thread.innerHTML = '';
  $('curTitle').textContent = '新对话';
  document.querySelectorAll('.recent-item').forEach(x => x.classList.remove('active'));
}

/* ===== 搜索弹窗 ===== */
const sQuery = $('sQuery'), sResults = $('sResults');
function openSearch(){ $('searchMask').classList.add('show'); sQuery.value = ''; sResults.innerHTML = ''; setTimeout(() => sQuery.focus(), 50); }
function closeSearch(){ $('searchMask').classList.remove('show'); }
async function renderSearch(q){
  if (!q.trim()) { sResults.innerHTML = ''; return; }
  try {
    const r = await fetch('/api/chat/search?userId=' + encodeURIComponent(userId) + '&q=' + encodeURIComponent(q.trim()),
      { headers: { 'Authorization': 'Bearer ' + token } });
    const j = await r.json();
    if (j.code !== 0 || !j.data.length) { sResults.innerHTML = '<div class="s-empty">未找到相关对话</div>'; return; }
    sResults.innerHTML = j.data.map(s =>
      '<div class="s-item" data-sid="' + escapeHtml(s.sessionId) + '">' +
        '<span class="s-dot"></span><span class="s-name">' + escapeHtml(s.title) + '</span>' +
        '<span class="s-time">' + fmtTime(s.time) + '</span></div>').join('');
    sResults.querySelectorAll('.s-item').forEach(el => el.onclick = () => {
      closeSearch();
      openSession(el.dataset.sid);
      loadHistory();
    });
  } catch (e) { sResults.innerHTML = '<div class="s-empty">搜索失败</div>'; }
}
sQuery.addEventListener('input', e => renderSearch(e.target.value));
sQuery.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); closeSearch(); } });
$('searchMask').addEventListener('click', e => { if (e.target === $('searchMask')) closeSearch(); });

/* ===== 输入框 ===== */
const autoGrow = () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 200) + 'px'; };
input.addEventListener('input', autoGrow);

/* ===== 发送（SSE 打字机） ===== */
function send(){
  if (streaming) return;
  const text = input.value.trim();
  if (!text) return;
  input.value = ''; autoGrow();
  sendMsg(text);
}

function sendMsg(text){
  addMsg('user', text);
  const aiBubble = addMsg('assistant', '');
  streaming = true;
  sendBtn.classList.add('stop');
  sendBtn.title = '停止';

  let url = '/api/chat/stream?message=' + encodeURIComponent(text) + '&token=' + encodeURIComponent(token);
  if (currentSessionId) url += '&sessionId=' + encodeURIComponent(currentSessionId);
  const es = new EventSource(url);
  let pendingTool = false;   // 工具状态占位中：下一个正文 token 先清掉状态行再写正文

  es.addEventListener('streamId', e => { window.__streamId = e.data; });
  es.addEventListener('sessionId', e => {
    currentSessionId = e.data;   // 新会话的身份证：后续消息带回去，历史按它归组
    loadHistory();
  });
  es.addEventListener('tool', e => {
    aiBubble.classList.remove('typing');
    aiBubble.textContent = '🔧 正在调用 ' + e.data + ' …';
    pendingTool = true;
    scrollBottom();
  });
  es.onmessage = e => {
    aiBubble.classList.remove('typing');
    if (pendingTool) { aiBubble.textContent = ''; pendingTool = false; }   // 状态行只占位，不混进正文
    aiBubble.textContent += e.data;
    scrollBottom();
  };
  es.onerror = () => {
    es.close();
    streaming = false;
    sendBtn.classList.remove('stop');
    sendBtn.title = '发送';
    if (currentSessionId) loadHistory();
  };
}

function stopStream(){
  if (!streaming) return;
  fetch('/api/chat/stop?streamId=' + (window.__streamId || '') + '&token=' + encodeURIComponent(token)).catch(() => {});
  streaming = false;
  sendBtn.classList.remove('stop');
  sendBtn.title = '发送';
}

/* ===== 上传识别 ===== */
const attachPanel = $('attachPanel'), apDrop = $('apDrop'), apList = $('apList'), apSend = $('apSend');
const apInput = document.createElement('input');
apInput.type = 'file'; apInput.multiple = true;
apInput.accept = '.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.csv,.txt,.md,.markdown';
apInput.style.display = 'none';
document.body.appendChild(apInput);
let attachFiles = [];

function toggleAttach(show){
  const want = show === undefined ? attachPanel.style.display === 'none' : show;
  attachPanel.style.display = want ? 'block' : 'none';
  if (!want) attachFiles = [];
  renderAttach();
}
$('attachBtn').onclick = () => toggleAttach();
function fmtSize(n){ return n < 1024*1024 ? Math.max(1, Math.round(n/1024)) + ' KB' : (n/1024/1024).toFixed(1) + ' MB'; }
function addAttachFiles(list){
  [...list].forEach(f => {
    if (f.size > 20*1024*1024) return;
    if (attachFiles.some(x => x.name === f.name && x.size === f.size)) return;
    attachFiles.push(f);
  });
  renderAttach();
}
function renderAttach(){
  apList.innerHTML = attachFiles.map((f, i) =>
    '<div class="ap-file"><span>📄</span><span class="fn">' + escapeHtml(f.name) + '</span><span class="fs">' + fmtSize(f.size) + '</span>' +
    '<button class="rm" data-i="' + i + '">✕</button></div>').join('');
  apList.querySelectorAll('.rm').forEach(b => b.onclick = () => { attachFiles.splice(+b.dataset.i, 1); renderAttach(); });
  apSend.disabled = attachFiles.length === 0;
}
apDrop.addEventListener('dragover', e => { e.preventDefault(); apDrop.classList.add('drag'); });
apDrop.addEventListener('dragleave', () => apDrop.classList.remove('drag'));
apDrop.addEventListener('drop', e => { e.preventDefault(); apDrop.classList.remove('drag'); addAttachFiles(e.dataTransfer.files); });
apDrop.addEventListener('click', () => apInput.click());
apInput.addEventListener('change', () => { addAttachFiles(apInput.files); apInput.value = ''; });

apSend.onclick = async () => {
  if (!attachFiles.length) return;
  const files = attachFiles.slice();
  toggleAttach(false);
  for (const f of files) {
    const fd = new FormData();
    fd.append('userId', userId);
    fd.append('file', f);
    try {
      const r = await fetch('/api/file/parse', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token }, body: fd });
      const j = await r.json();
      if (j.code !== 0) { addMsg('user', '📄 ' + f.name); addMsg('assistant', j.msg || '识别失败'); continue; }
      const text = j.data.text.length > 3000 ? j.data.text.slice(0, 3000) + '…' : j.data.text;
      addMsg('user', '📄 ' + f.name + '（' + fmtSize(j.data.size) + '）');
      sendMsg('请分析我上传的文件「' + f.name + '」，内容如下：\n```\n' + text + '\n```\n请总结要点。');
    } catch (e) {
      addMsg('user', '📄 ' + f.name);
      addMsg('assistant', '网络异常，识别失败');
    }
  }
};

/* ===== 其他 ===== */
function logout(){ sessionStorage.removeItem('token'); sessionStorage.removeItem('userId'); location.replace('login.html'); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

$('send').onclick = () => { if (streaming) stopStream(); else send(); };
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });

loadHistory();
</script>
</body>
