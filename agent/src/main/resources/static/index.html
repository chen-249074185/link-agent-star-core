<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>SSE 聊天测试（可停止）</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; }
        #chat { border: 1px solid #ccc; min-height: 300px; padding: 10px; margin-bottom: 10px; }
        #chat div { margin: 5px 0; padding: 6px; border-radius: 4px; }
        #chat .user { background: #e6f3ff; }   /* 用户消息：浅蓝 */
        #chat .ai { background: #f0f0f0; }     /* AI 回复：浅灰 */
        #chat .sys { background: #fff3cd; font-size: 12px; color: #856404; }  /* 系统提示：浅黄 */
        #input { width: 60%; padding: 8px; }
        button { padding: 8px 16px; }
        #stopBtn { background: #dc3545; color: white; display: none; }  /* 停止按钮：默认隐藏，有流时才显示 */
    </style>
</head>
<body>
    <div id="chat"></div>

    <input id="input" type="text" placeholder="说点什么..." />
    <button onclick="send()">发送</button>
    <button id="stopBtn" onclick="stopStream()">停止</button>

    <script>
        let es = null;        // 当前的 SSE 连接
        let streamId = null;  // 当前流的身份证（后端首推事件里发来）

        function send() {
            if (es) return;   // 已有流在跑，防重复发送

            const input = document.getElementById('input');
            const text = input.value.trim();
            if (!text) return;

            const chat = document.getElementById('chat');

            const userDiv = document.createElement('div');
            userDiv.className = 'user';
            userDiv.textContent = text;
            chat.appendChild(userDiv);

            const aiDiv = document.createElement('div');
            aiDiv.className = 'ai';
            chat.appendChild(aiDiv);

            es = new EventSource('/api/chat/stream?message=' + encodeURIComponent(text));

            // 命名事件：后端首推的 streamId（拿它才能调 /stop）
            es.addEventListener('streamId', (e) => {
                streamId = e.data;
                document.getElementById('stopBtn').style.display = 'inline';
            });

            es.onmessage = (e) => {
                aiDiv.textContent += e.data;   // 打字机：逐 token 追加
            };

            es.onerror = () => {
                es.close();
                es = null;
                streamId = null;
                document.getElementById('stopBtn').style.display = 'none';
            };

            input.value = '';
        }

        // 点"停止"：调后端 /stop，按 streamId 终止当前流
        function stopStream() {
            if (!streamId) return;
            fetch('/api/chat/stop?streamId=' + streamId)
                .then(r => r.text())
                .then(msg => {
                    const sys = document.createElement('div');
                    sys.className = 'sys';
                    sys.textContent = '【已停止】' + msg;
                    document.getElementById('chat').appendChild(sys);
                });
        }
    </script>
</body>
</html>
