<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的知识库 - 星链智核</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f3f1ec;--ink:#4a2b2b;--ink-soft:#8a7070;--ink-faint:#c4b3b3;
  --pink-deep:#e07878;--red:#d94f4f;--green:#5aa87a;--white:#fffdf9;
}
body{min-height:100vh;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center;padding:24px 16px}
.card{width:420px;max-width:100%}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.top h1{font-size:20px}
.top .links{font-size:13px}
.top .links a{color:var(--pink-deep);text-decoration:none;font-weight:600;margin-left:12px}
.box{background:var(--white);border-radius:14px;padding:20px;box-shadow:0 6px 24px rgba(74,43,43,.06);margin-bottom:16px}
.box h2{font-size:15px;margin-bottom:14px}
.box .tip{font-size:11.5px;color:var(--ink-soft);line-height:1.6;margin-bottom:14px}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(74,43,43,.06);font-size:14px}
.row:last-child{border-bottom:none}
.row .k{color:var(--ink-soft);word-break:break-all}
.row .v{font-weight:600}
.mini{background:transparent;border:1px solid rgba(74,43,43,.15);border-radius:8px;padding:5px 12px;font-size:12px;color:var(--ink-soft);cursor:pointer}
.mini:hover{color:var(--red);border-color:var(--red)}
.mini.primary{color:var(--pink-deep);border-color:var(--pink-deep)}
.mini.primary:hover{color:#fff;background:var(--pink-deep)}
.field{margin-bottom:12px}
.field input{width:100%;padding:12px 13px;background:#fff;border:2px solid rgba(74,43,43,.1);border-radius:10px;font-size:14px;outline:none;color:var(--ink);transition:all .25s}
.field input:focus{border-color:var(--pink-deep);box-shadow:0 0 0 3px rgba(224,120,120,.1)}
.btn{width:100%;padding:13px;margin-top:8px;background:var(--ink);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;transition:all .25s;letter-spacing:1px}
.btn:hover:not(:disabled){transform:translateY(-1px);background:var(--pink-deep)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border:2px solid rgba(74,43,43,.15);color:var(--ink-soft)}
.btn.ghost:hover{background:rgba(74,43,43,.04)}
.toast{width:100%;padding:10px 14px;border-radius:10px;font-size:12px;margin-bottom:14px;display:none;text-align:center}
.toast.error{display:block;background:rgba(217,79,79,.08);color:var(--red);border:1px solid rgba(217,79,79,.2)}
.toast.success{display:block;background:rgba(90,168,122,.08);color:var(--green);border:1px solid rgba(90,168,122,.2)}
.sp{display:inline-block;width:13px;height:13px;border:2px solid transparent;border-top-color:currentColor;border-radius:50%;animation:spin .5s linear infinite;vertical-align:middle;margin-right:5px}
@keyframes spin{to{transform:rotate(360deg)}}
.mask{position:fixed;inset:0;background:rgba(74,43,43,.35);display:none;align-items:center;justify-content:center;z-index:99;padding:20px}
.mask.show{display:flex}
.dlg{background:#fffdf9;border-radius:14px;padding:22px;max-width:360px;width:100%;text-align:center}
.dlg h3{font-size:16px;margin-bottom:10px}
.dlg p{font-size:12.5px;color:var(--ink-soft);line-height:1.7;margin-bottom:18px;text-align:left}
.dlg .btns{display:flex;gap:10px}
.dlg .btns button{flex:1;padding:11px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;border:none}
.dlg .cancel{background:rgba(74,43,43,.08);color:var(--ink-soft)}
.dlg .ok{background:var(--red);color:#fff}
.hit{background:#fffdf9;border-radius:10px;padding:12px;margin-bottom:10px;font-size:13px;line-height:1.7;border:1px solid rgba(74,43,43,.06)}
.hit .sc{display:inline-block;font-size:11px;color:var(--pink-deep);font-weight:700;margin-bottom:4px}
.hit .tx{color:var(--ink)}
.empty{text-align:center;color:var(--ink-faint);font-size:13px;padding:16px 0}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <h1>我的知识库</h1>
    <div class="links">
      <a href="index.html">对话</a>
      <a href="config.html">配置</a>
      <a href="profile.html">个人信息</a>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="box">
    <h2>上传资料</h2>
    <p class="tip">支持 pdf / txt / md / docx / xlsx / pptx / csv，单文件 ≤ 50MB。上传后自动切片入库，可用作对话问答与租房决策的资料源。</p>
    <div class="field"><input type="file" id="file" accept=".pdf,.txt,.md,.markdown,.docx,.xlsx,.pptx,.csv"></div>
    <button class="btn" id="upBtn" onclick="upload()">上传到默认知识库</button>
  </div>

  <div class="box">
    <h2>知识库文件</h2>
    <div id="kbList"><div class="empty">加载中…</div></div>
  </div>

  <div class="box">
    <h2>语义检索</h2>
    <p class="tip">输入问题，从你的知识库中检索最相关的片段（默认库，Top5）。</p>
    <div class="field"><input type="text" id="q" placeholder="例：北京有哪些月租 6000 以内的房源？"></div>
    <button class="btn" id="qBtn" onclick="search()">检索</button>
    <div id="hits" style="margin-top:14px"></div>
  </div>
</div>

<!-- 删除确认弹窗 -->
<div class="mask" id="mask">
  <div class="dlg">
    <h3>删除文件</h3>
    <p id="delDesc">删除后该文件的全部内容将从知识库清除，不可恢复。</p>
    <div class="btns">
      <button class="cancel" onclick="closeMask()">取消</button>
      <button class="ok" onclick="doDelete()">确认删除</button>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const token=sessionStorage.getItem('token');
const userId=sessionStorage.getItem('userId');
if(!token){location.href='login.html';}

let delFile=null;   // 待删除的文件名

function showToast(msg,type){const t=$('toast');t.textContent=msg;t.className='toast '+type;if(type==='error')setTimeout(()=>t.className='toast',4000);}
function ld(btn,on,txt){btn.disabled=on;btn.innerHTML=on?'<span class="sp"></span>'+txt:txt;}
function openMask(desc){$('delDesc').textContent=desc;$('mask').classList.add('show');}
function closeMask(){$('mask').classList.remove('show');delFile=null;}

// 知识库文件列表（默认库，文件级：文件名 | 块数 | 时间）
async function loadKbs(){
  try{
    const r=await fetch('/api/rag/files?userId='+encodeURIComponent(userId),{headers:{'Authorization':'Bearer '+token}});
    const j=await r.json();
    if(j.code!==0){showToast(j.msg||'加载失败','error');$('kbList').innerHTML='<div class="empty">加载失败</div>';return;}
    const lines=j.data.split('\n').map(s=>s.trim()).filter(Boolean);
    if(!lines.length){$('kbList').innerHTML='<div class="empty">知识库暂无文件</div>';return;}
    $('kbList').innerHTML=lines.map(line=>{
      const parts=line.split('|').map(s=>s.trim());
      const name=parts[0]||line;
      const meta=[parts[1],parts[2]].filter(Boolean).join(' · ');
      const d=document.createElement('div');
      d.className='row';
      d.innerHTML='<span class="k">'+escapeHtml(name)+'<br><small>'+escapeHtml(meta)+'</small></span>';
      const b=document.createElement('button');
      b.className='mini';b.textContent='删除';
      b.onclick=()=>{delFile=name;openMask('确认删除文件「'+name+'」？该文件的全部内容将从知识库清除，不可恢复。');};
      d.appendChild(b);
      return d.outerHTML;
    }).join('');
  }catch(e){showToast('网络异常','error');$('kbList').innerHTML='<div class="empty">加载失败</div>';}
}

// 上传
async function upload(){
  const f=$('file').files[0];
  if(!f){showToast('请先选择文件','error');return;}
  ld($('upBtn'),true,'上传中');
  try{
    const fd=new FormData();
    fd.append('userId',userId);
    fd.append('file',f);
    const r=await fetch('/api/rag/upload',{method:'POST',headers:{'Authorization':'Bearer '+token},body:fd});
    const j=await r.json();
    if(j.code!==0){showToast(j.msg||'上传失败','error');return;}
    showToast(j.data||'上传成功','success');
    $('file').value='';
    loadKbs();
  }catch(e){showToast('网络异常，请稍后重试','error');}
  finally{ld($('upBtn'),false,'上传到默认知识库');}
}

// 删除文件（确认后）
async function doDelete(){
  if(!delFile)return;
  closeMask();
  try{
    const r=await fetch('/api/rag/delete-file?userId='+encodeURIComponent(userId)+'&filename='+encodeURIComponent(delFile),{method:'DELETE',headers:{'Authorization':'Bearer '+token}});
    const j=await r.json();
    if(j.code!==0){showToast(j.msg||'删除失败','error');return;}
    showToast(j.data||'已删除','success');
    loadKbs();
  }catch(e){showToast('网络异常，请稍后重试','error');}
}

// 语义检索
async function search(){
  const q=$('q').value.trim();
  if(!q){showToast('请输入问题','error');return;}
  ld($('qBtn'),true,'检索中');
  $('hits').innerHTML='';
  try{
    const r=await fetch('/api/rag/search?userId='+encodeURIComponent(userId)+'&query='+encodeURIComponent(q)+'&topK=5',{headers:{'Authorization':'Bearer '+token}});
    const j=await r.json();
    if(j.code!==0){showToast(j.msg||'检索失败','error');return;}
    const lines=j.data.split('\n').map(s=>s.trim()).filter(Boolean);
    if(!lines.length){$('hits').innerHTML='<div class="empty">未找到相关片段</div>';return;}
    $('hits').innerHTML=lines.map(line=>{
      const m=line.match(/^\[score=([\d.]+)\]\s*(.*)$/s);
      const sc=m?m[1]:'';
      const tx=m?m[2]:line;
      return '<div class="hit"><div class="sc">'+(sc?'相关度 '+sc:'')+'</div><div class="tx">'+escapeHtml(tx)+'</div></div>';
    }).join('');
  }catch(e){showToast('网络异常，请稍后重试','error');}
  finally{ld($('qBtn'),false,'检索');}
}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

loadKbs();
</script>
</body>
</html>
