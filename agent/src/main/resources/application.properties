spring.application.name=agent
# MySQL（W6 记忆系统启用，坑10 解除）：凭据走 .env（已 gitignore，零明文入库）
# .env 是 KEY=VALUE 的 properties 兼容格式，spring.config.import 直接加载
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=jdbc:mysql://localhost:3306/linkagent?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# MyBatis：mapper XML 放 classpath:mapper/ 下；下划线列名自动转驼峰属性（created_at → createdAt）
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
# Mock/真实切换开关：true=Mock 占位 Skill 注册（W4），false=走真实 MCP（W7~W9 翻转，Workflow 零改动）
linkagent.workflow.mock-enabled=false
# rag-mcp fat jar 路径（mock=false 时主程序拉起此子进程，路径相对 agent\agent 运行目录）
linkagent.mcp.rag-jar=../rag-mcp/target/rag-mcp-0.0.1-SNAPSHOT.jar
# rag-mcp 数据目录（rag.db/vec0.dll 落这里，相对运行目录；不放 target 防 mvn clean 删数据）
linkagent.mcp.rag-data-dir=rag_data
# crawl-mcp fat jar 路径（爬虫 server，W9）
linkagent.mcp.crawl-jar=../crawl-mcp/target/crawl-mcp-0.0.1-SNAPSHOT.jar
# liepin-mcp fat jar 路径（猎聘求职 server，W9；Token 由 AppConfig 从 .env 读后经环境变量注入子进程）
linkagent.mcp.liepin-jar=../liepin-mcp/target/liepin-mcp-0.0.1-SNAPSHOT.jar
# Redis 连接（本机 Memurai，Redis 兼容，默认无密码）
spring.data.redis.host=localhost
spring.data.redis.port=6379
# SMTP 发信（W12 用户体系）：凭据走 .env（MAIL_USER/MAIL_AUTH_CODE，授权码非登录密码；host 必须配 bean 才装配）
# 发信服务可切换：QQ=smtp.qq.com:465 / 163=smtp.163.com:465，改 MAIL_HOST/MAIL_PORT 或下面默认值即可
spring.mail.host=${MAIL_HOST:smtp.163.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_AUTH_CODE:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
# 治理存储实现切换：true=Redis 版（正式，W6），false=内存版（临时兜底）
linkagent.redis-enabled=true
# 微信 Bot 启动器：true=应用启动时自动拉起微信 Bot（Spring 化接线，对话落 Redis/MySQL 记忆）；false=不起（手动 main 扫码用）
linkagent.wechat.bot-enabled=true
# anydoc 文档识别（vendored 在 agent/anydoc/，gitignore）：node + cli.js 子进程，路径相对 agent\agent 运行目录
linkagent.anydoc.node=node
linkagent.anydoc.path=anydoc/node_modules/@firecrawl/anydoc/cli.js
